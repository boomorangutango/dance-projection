<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Shadow Partner</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --panel: rgba(18, 18, 18, 0.9);
    --line: #3a3a3a;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: var(--bg); }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; background: var(--bg);
  }
  #intro h1 { margin: 0; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; font-size: 22px; }
  #intro p { margin: 0; color: var(--muted); max-width: 330px; line-height: 1.5; font-size: 15px; }
  #startBtn {
    margin-top: 8px; padding: 16px 44px; border-radius: 999px; border: 1px solid var(--fg);
    background: transparent; color: var(--fg); font-size: 17px; letter-spacing: 0.15em; text-transform: uppercase;
  }
  #startBtn:disabled { opacity: 0.45; }
  #status { color: var(--muted); font-size: 14px; min-height: 1.4em; max-width: 340px; line-height: 1.4; }

  #controls {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(480px, calc(100vw - 32px)); max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--panel); border-radius: 18px; padding: 14px 16px;
    display: none; flex-direction: column; gap: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #controls.show { display: flex; }
  .modes, .styles, .looks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .modes, .looks { grid-template-columns: repeat(5, 1fr); }
  .worlds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .worlds button { font-size: 12px; padding: 9px 2px; border-radius: 10px; border: 1px solid var(--line); background: #0d0d0d; color: var(--fg); }
  .worlds button.on { border-color: var(--fg); background: #222; }
  .modes button, .looks button { font-size: 12px !important; padding: 9px 2px !important; }
  .styles button { font-size: 12px !important; padding: 8px 4px !important; }
  .modes button, .styles button, .looks button, .row button {
    padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: #0d0d0d; color: var(--fg);
    font-size: 14px;
  }
  .modes button.on, .styles button.on, .looks button.on, .row button.on { border-color: var(--fg); background: #222; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1 1 auto; font-size: 13px; }
  .row button:disabled { opacity: 0.45; }
  .section { display: flex; flex-direction: column; gap: 10px; }
  .section[hidden] { display: none; }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  label.slider { display: grid; grid-template-columns: 100px 1fr 40px; align-items: center; gap: 10px; font-size: 13px; color: #cfcfcf; }
  label.slider input { width: 100%; accent-color: #fff; }
  label.slider span { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary .label::after { content: " +"; }
  details[open] summary .label::after { content: " −"; }
  details .section { margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  #fps {
    position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; display: none; pointer-events: none;
  }
  #fps.show { display: block; }
  #meter { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; display: none; align-items: flex-end; gap: 8px; pointer-events: none; color: var(--muted); font-size: 12px; }
  #meter .bars { display: flex; align-items: flex-end; gap: 3px; height: 28px; }
  #meter .bars i { display: block; width: 6px; height: 0; background: #9ab; border-radius: 2px; }
  #meter .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0.15; margin-bottom: 2px; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<div id="intro">
  <h1>Shadow Partner</h1>
  <p>Set the phone where it can see your whole body, then tap start and allow the camera.</p>
  <button id="startBtn" disabled>Start</button>
  <div id="status">Loading…</div>
  <div id="version" style="color: var(--muted); font-size: 12px;"></div>
</div>

<div id="fps"></div>
<div id="meter"><div class="bars"><i data-bar="b"></i><i data-bar="m"></i><i data-bar="h"></i></div><span class="dot"></span><span class="bpm"></span></div>

<div id="controls">
  <div class="modes" id="modes">
    <button data-mode="shadow">Shadow</button>
    <button data-mode="trails">Trails</button>
    <button data-mode="paint">Paint</button>
    <button data-mode="partner">Partner</button>
    <button data-mode="field">Field</button>
  </div>

  <div class="section">
    <div class="label">Look <span id="lookNote" style="text-transform:none; letter-spacing:0;"></span></div>
    <div class="looks" id="looks">
      <button data-look="crisp">Crisp</button>
      <button data-look="smooth">Smooth</button>
      <button data-look="calm">Calm</button>
      <button data-look="bold">Bold</button>
      <button data-look="dreamy">Dreamy</button>
    </div>
  </div>

  <div class="section">
    <div class="row"><button id="musicBtn">Music: off</button></div>
    <label class="slider" id="musicAmtRow">Music strength <input data-key="musicAmt" type="range" min="0" max="2" step="0.1"><span></span></label>
    <div class="hint" id="musicNote" style="text-align:left"></div>
  </div>

  <div class="section">
    <div class="styles" id="styles">
      <button data-style="solid">Solid</button>
      <button data-style="outline">Outline</button>
      <button data-style="neon">Neon edge</button>
      <button id="invertBtn">Invert</button>
    </div>
    <label class="slider">Line width <input data-key="line" type="range" min="1" max="12" step="0.5"><span></span></label>
  </div>

  <div class="section" data-for="trails">
    <label class="slider">Trail length <input data-key="trailLength" type="range" min="0" max="1" step="0.01"><span></span></label>
  </div>
  <div class="section" data-for="paint">
    <label class="slider">Fade <input data-key="paintFade" type="range" min="0" max="1" step="0.01"><span></span></label>
    <label class="slider">Color speed <input data-key="hueSpeed" type="range" min="0" max="1" step="0.01"><span></span></label>
    <div class="row"><button id="clearBtn">Clear the wall</button></div>
  </div>
  <div class="section" data-for="field">
    <div class="worlds" id="worlds">
      <button data-world="dots">Dots</button>
      <button data-world="web">Web</button>
      <button data-world="sparks">Sparks</button>
      <button data-world="snow">Snow</button>
      <button data-world="ripples">Ripples</button>
      <button data-world="wind">Wind</button>
      <button data-world="strings">Strings</button>
      <button data-world="ink">Ink</button>
    </div>
    <div class="row" id="scatterRow">
      <button data-field="scatter">Scatter</button>
      <button data-field="gather">Gather</button>
    </div>
    <label class="slider" id="amountRow">Amount <input data-key="dots" type="range" min="0.3" max="2" step="0.1"><span></span></label>
    <label class="slider">Strength <input data-key="push" type="range" min="0.2" max="2" step="0.1"><span></span></label>
    <label class="slider" id="returnRow"><span id="returnLabel">Return</span> <input data-key="springBack" type="range" min="0" max="2" step="0.1"><span></span></label>
    <div class="row" id="clearWorldRow"><button id="clearWorldBtn">Start over</button></div>
  </div>
  <div class="section" data-for="partner">
    <label class="slider">Delay (sec) <input data-key="delay" type="range" min="0.1" max="3" step="0.05"><span></span></label>
    <label class="slider">Shift <input data-key="shift" type="range" min="-0.5" max="0.5" step="0.01"><span></span></label>
    <div class="row"><button id="facingBtn">Facing me</button><button id="beatDelayBtn">Delay: seconds</button></div>
  </div>

  <details>
    <summary><span class="label">Fine-tune and setup</span></summary>
    <div class="section">
      <label class="slider">Smoothness <input data-key="smooth" type="range" min="0" max="8" step="0.5"><span></span></label>
      <label class="slider">Steadiness <input data-key="steady" type="range" min="0" max="0.85" step="0.05"><span></span></label>
      <label class="slider">Stickiness <input data-key="sticky" type="range" min="0" max="0.45" step="0.05"><span></span></label>
      <label class="slider">Speck cleanup <input data-key="cleanup" type="range" min="0" max="0.5" step="0.01"><span></span></label>
      <label class="slider" id="limbsRow">Arm fill <input data-key="limbs" type="range" min="0" max="1.6" step="0.1"><span></span></label>
      <label class="slider">Cutoff <input data-key="cutoff" type="range" min="0.25" max="0.75" step="0.01"><span></span></label>
      <label class="slider">Softness <input data-key="soft" type="range" min="0" max="0.2" step="0.01"><span></span></label>
      <label class="slider">Glow <input data-key="glow" type="range" min="0" max="1" step="0.05"><span></span></label>
      <label class="slider">Size <input data-key="size" type="range" min="0.5" max="1.5" step="0.05"><span></span></label>
      <div class="row">
        <button id="flipBtn">Switch camera</button>
        <button id="mirrorBtn">Mirror</button>
        <button id="fillBtn">Fill screen</button>
        <button id="followBtn">Follow me</button>
      </div>
      <div class="row">
        <button id="modelBtn">Model: Selfie</button>
        <button id="engineBtn">Engine: GPU</button>
        <button id="fullBtn">Fullscreen</button>
        <button id="resetBtn">Reset settings</button>
      </div>
    </div>
  </details>
  <div class="hint">Tap the screen to hide or show these controls.</div>
</div>

<script type="module">
// ======================================================================
// Shadow Partner
// Camera -> small frame -> MediaPipe body segmentation (GPU) -> small mask
// -> WebGL: steadiness blend, blur, crisp edge, effects -> screen
// ======================================================================

// Bump with every change so the phone shows which version it loaded.
const APP_VERSION = "v10";
const TASKS_VERSION = "0.10.14";
const TASKS_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TASKS_VERSION}/vision_bundle.mjs`;
const WASM_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TASKS_VERSION}/wasm`;
const MODELS = {
  // Full-body pose model: a body mask plus joint positions. Trained on whole bodies
  // at a distance, so it suits dancing better than the selfie models.
  body: {
    label: "Pose (test)", kind: "pose",
    url: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"
  },
  // Selfie models: made for video calls (one person close to the camera).
  fast: {
    label: "Selfie", kind: "seg", invert: false,   // channel 0 = person
    url: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"
  },
  quality: {
    label: "HQ (slow)", kind: "seg", invert: true, // channel 0 = background
    url: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite"
  }
};
const MODEL_ORDER = ["fast", "quality", "body"];
const DEMO = new URLSearchParams(location.search).has("demo");

// ---------------- Settings (remembered on this device) ----------------
const DEFAULTS = {
  mode: "shadow",
  smooth: 3, steady: 0.2, cutoff: 0.45, soft: 0, glow: 0, size: 1,
  sticky: 0.3, cleanup: 0.15, limbs: 1, follow: true,
  look: "smooth",
  musicAmt: 1, partnerBeats: 0,
  world: "dots", fieldMode: "scatter", dots: 1, push: 1, springBack: 1,
  style: "neon", line: 3, invert: false, fill: true,
  trailLength: 0.6,
  paintFade: 0.15, hueSpeed: 0.35,
  delay: 1.0, shift: 0, facing: true,
  mirror: true, facingMode: "user", model: "fast", engine: "gpu"
};
const STORE_KEY = "shadow-partner-settings-v4";
// Looks: tested combinations of the edge sliders that each feel clearly different.
const LOOKS = {
  crisp:  { smooth: 1.5, steady: 0.1,  sticky: 0.1,  cutoff: 0.5,  soft: 0,    glow: 0 },   // sharp, instant, a bit jittery
  smooth: { smooth: 3,   steady: 0.25, sticky: 0.3,  cutoff: 0.45, soft: 0,    glow: 0 },   // the default balance
  calm:   { smooth: 3.5, steady: 0.65, sticky: 0.45, cutoff: 0.45, soft: 0.02, glow: 0 },   // steadiest, lags a little
  bold:   { smooth: 5,   steady: 0.35, sticky: 0.35, cutoff: 0.3,  soft: 0,    glow: 0 },   // fuller, rounder figure
  dreamy: { smooth: 6,   steady: 0.5,  sticky: 0.3,  cutoff: 0.45, soft: 0.1,  glow: 0.8 }  // soft and glowing
};
const LOOK_KEYS = ["smooth", "steady", "sticky", "cutoff", "soft", "glow"];
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
if (!MODELS[S.model]) S.model = "fast";
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------------- DOM ----------------
const $ = (id) => document.getElementById(id);
const video = $("video"), stage = $("stage"), intro = $("intro"), startBtn = $("startBtn");
const statusEl = $("status"), controls = $("controls"), fpsEl = $("fps");

// ---------------- WebGL setup ----------------
const gl = stage.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: "high-performance" });
if (!gl) { statusEl.textContent = "This browser can't run the graphics this app needs (WebGL)."; throw new Error("no webgl"); }
const derivExt = gl.getExtension("OES_standard_derivatives");

const VERT = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() { v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

// Shared helpers for the display shaders. The field texture is the smoothed
// "how much is this pixel a person" value, 0..1, stored top row first.
const COMMON = `
${derivExt ? "#extension GL_OES_standard_derivatives : enable" : ""}
precision highp float;
varying vec2 v_uv;
uniform vec4 u_fit;      // image rect on screen: x0, y0, w, h (0..1)
uniform float u_mirror;
uniform float u_cut;
uniform float u_soft;
uniform float u_glow;
uniform float u_style;   // 0 solid, 1 outline, 2 neon
uniform float u_line;    // outline width in screen pixels
uniform float u_invert;
float fieldAt(sampler2D tex, vec2 uv) {
  vec2 p = (uv - u_fit.xy) / u_fit.zw;
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) return 0.0;
  if (u_mirror > 0.5) p.x = 1.0 - p.x;
  p.y = 1.0 - p.y;
  return texture2D(tex, p).r;
}
float aaWidth(float f) {
  ${derivExt ? "return max(fwidth(f) * 0.9, 0.0015);" : "return 0.02;"}
}
// Crisp, anti-aliased body shape from the smooth field.
float body(float f) {
  float w = aaWidth(f) + u_soft;
  return smoothstep(u_cut - w, u_cut + w, f);
}
// Soft halo just outside the body edge.
float halo(float f) {
  return u_glow * smoothstep(u_cut * 0.15, u_cut, f) * 0.55;
}
// Line along the body edge, u_line pixels wide.
float outline(float f) {
  ${derivExt ? "float d = abs(f - u_cut) / max(fwidth(f), 1e-4);" : "float d = abs(f - u_cut) / 0.01;"}
  float h = u_line * 0.5;
  return 1.0 - smoothstep(h - 0.5, h + 0.75 + u_soft * 40.0, d);
}
// The figure in the chosen style: 1 = full white.
float figure(float f) {
  float b = body(f);
  if (u_style < 0.5) return b;
  float l = outline(f);
  if (u_style < 1.5) return l;
  // Neon: dim fill that brightens toward the edge, with a crisp bright line.
  float inner = b * (0.16 + 0.5 * (1.0 - smoothstep(u_cut, min(u_cut + 0.45, 0.99), f)));
  return max(inner, l);
}
vec4 finish(vec3 c) { c = clamp(c, 0.0, 1.0); return vec4(mix(c, 1.0 - c, u_invert), 1.0); }
vec3 hue(float h) {
  vec3 k = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return mix(vec3(1.0), k, 0.85);
}`;

const SHADERS = {
  fade: `precision mediump float; varying vec2 v_uv; uniform sampler2D u_prev; uniform float u_decay;
    void main() { vec3 p = texture2D(u_prev, v_uv).rgb; gl_FragColor = vec4(max(p * u_decay - vec3(1.5 / 255.0), 0.0), 1.0); }`,
  // Put the model's mask (made from a zoomed-in crop) back where it belongs in the full frame.
  place: `precision mediump float; varying vec2 v_uv;
    uniform sampler2D u_crop; uniform vec4 u_rect;
    void main() {
      vec2 q = (v_uv - u_rect.xy) / u_rect.zw;
      float inside = step(0.0, q.x) * step(q.x, 1.0) * step(0.0, q.y) * step(q.y, 1.0);
      gl_FragColor = vec4(vec3(texture2D(u_crop, clamp(q, 0.0, 1.0)).r * inside), 1.0); }`,
  // Sticky on/off: turns on above u_hi, only turns off below u_lo.
  sticky: `precision mediump float; varying vec2 v_uv;
    uniform sampler2D u_raw; uniform sampler2D u_prev; uniform float u_hi; uniform float u_lo;
    void main() {
      float p = texture2D(u_raw, v_uv).r; float was = texture2D(u_prev, v_uv).r;
      float on = was > 0.5 ? step(u_lo, p) : step(u_hi, p);
      gl_FragColor = vec4(vec3(on), 1.0); }`,
  // Steadiness: blend the new mask with the previous steadied one.
  steady: `precision mediump float; varying vec2 v_uv;
    uniform sampler2D u_new; uniform sampler2D u_prev; uniform float u_k;
    void main() { float n = texture2D(u_new, v_uv).r; float p = texture2D(u_prev, v_uv).r;
      float k = n > p ? u_k * 0.25 : u_k;
      gl_FragColor = vec4(vec3(mix(n, p, k)), 1.0); }`,
  // Separable gaussian blur (9-tap equivalent using linear filtering).
  blur: `precision mediump float; varying vec2 v_uv;
    uniform sampler2D u_src; uniform vec2 u_dir;
    void main() {
      float s = texture2D(u_src, v_uv).r * 0.2270270270;
      s += (texture2D(u_src, v_uv + u_dir * 1.3846153846).r + texture2D(u_src, v_uv - u_dir * 1.3846153846).r) * 0.3162162162;
      s += (texture2D(u_src, v_uv + u_dir * 3.2307692308).r + texture2D(u_src, v_uv - u_dir * 3.2307692308).r) * 0.0702702703;
      gl_FragColor = vec4(vec3(s), 1.0); }`,
  shadow: COMMON + `
    uniform sampler2D u_field;
    void main() {
      float f = fieldAt(u_field, v_uv);
      float b = body(f);
      vec3 c = vec3(figure(f)) + vec3(0.75, 0.85, 1.0) * halo(f) * (1.0 - b);
      gl_FragColor = finish(c); }`,
  // Feedback: fade what was there, then lay the current body on top.
  feedback: COMMON + `
    uniform sampler2D u_field; uniform sampler2D u_prev;
    uniform float u_decay; uniform float u_sub; uniform float u_ink; uniform vec3 u_color;
    void main() {
      vec3 prev = texture2D(u_prev, v_uv).rgb;
      prev = max(prev * u_decay - vec3(u_sub), 0.0);
      float b = body(fieldAt(u_field, v_uv));
      gl_FragColor = vec4(mix(prev, u_color, b * u_ink), 1.0); }`,
  // Show the feedback buffer with the live body drawn over it.
  trailsShow: COMMON + `
    uniform sampler2D u_field; uniform sampler2D u_buf;
    void main() {
      float f = fieldAt(u_field, v_uv);
      float b = body(f);
      vec3 trail = texture2D(u_buf, v_uv).rgb * 0.55;
      vec3 c = mix(trail * (1.0 - b), vec3(1.0), figure(f)) + vec3(0.75, 0.85, 1.0) * halo(f) * (1.0 - b);
      gl_FragColor = finish(c); }`,
  paintShow: COMMON + `
    uniform sampler2D u_field; uniform sampler2D u_buf;
    void main() {
      float f = fieldAt(u_field, v_uv);
      vec3 paint = texture2D(u_buf, v_uv).rgb;
      float line = outline(f);
      vec3 c = mix(paint, vec3(1.0), line * 0.95) + vec3(1.0) * halo(f) * 0.5;
      gl_FragColor = finish(c); }`,
  // Field worlds drawn behind the figure: a color texture (ink, trails) or a water height map (ripples).
  compose: COMMON + `
    uniform sampler2D u_field; uniform sampler2D u_bg; uniform float u_bgMode; uniform float u_flipY; uniform vec2 u_texel;
    void main() {
      vec2 q = vec2(v_uv.x, u_flipY > 0.5 ? 1.0 - v_uv.y : v_uv.y);
      vec3 bg;
      if (u_bgMode < 0.5) bg = texture2D(u_bg, q).rgb;
      else {
        float hL = texture2D(u_bg, q - vec2(u_texel.x, 0.0)).r, hR = texture2D(u_bg, q + vec2(u_texel.x, 0.0)).r;
        float hU = texture2D(u_bg, q - vec2(0.0, u_texel.y)).r, hD = texture2D(u_bg, q + vec2(0.0, u_texel.y)).r;

// ---------------- GPU state that depends on sizes ----------------
let maskW = 0, maskH = 0;

let steadyA = null, steadyB = null, blurTmp = null, field = null;
const HISTORY = 100;           // ~3.3 s at 30 fps, for the partner delay

let cropTex = null, cropW = 0, cropH = 0, cropBytes = null;

const FULL_LONG = 640;

function ensureMaskTargets(w, h) {

// probability -> sticky on/off -> arms and hands drawn from the pose joints

let state = null, mark = null, labels = null, stack = null, prob = null;

const BONES = [
  // [a, b, kind]  kind: 0 torso, 1 arm, 2 hand, 3 leg
  [11, 12, 0], [11, 23, 0], [12, 24, 0], [23, 24, 0],
  [11, 13, 1], [13, 15, 1], [12, 14, 1], [14, 16, 1],
  [15, 17, 2], [15, 19, 2], [15, 21, 2], [17, 19, 2],
  [16, 18, 2], [16, 20, 2], [16, 22, 2], [18, 20, 2],
  [23, 25, 3], [25, 27, 3], [24, 26, 3], [26, 28, 3],
  [27, 29, 3], [27, 31, 3], [29, 31, 3], [28, 30, 3], [28, 32, 3], [30, 32, 3]

const BONE_RADIUS = [0.30, 0.17, 0.13, 0.20]; // as a fraction of shoulder width

function drawCapsule(ax, ay, bx, by, r, w, h) {
  const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - r)), x1 = Math.min(w - 1, Math.ceil(Math.max(ax, bx) + r));
  const y0 = Math.max(0, Math.floor(Math.min(ay, by) - r)), y1 = Math.min(h - 1, Math.ceil(Math.max(ay, by) + r));
  const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1e-6, r2 = r * r;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      let t = ((x - ax) * dx + (y - ay) * dy) / len2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = x - (ax + t * dx), ey = y - (ay + t * dy);
      if (ex * ex + ey * ey <= r2) { const i = y * w + x; state[i] = 1; mark[i] = 1; }

function drawSkeleton(poses, w, h) {
  for (const lm of poses) {
    // Some versions report no visibility scores; then trust every joint.
    const hasVis = lm.some((q) => q && q.visibility > 0);
    const vis = (k) => !!lm[k] && (!hasVis || lm[k].visibility > 0.5);
    const P = (k) => [lm[k].x * w, lm[k].y * h];
    let scale = 0;
    if (vis(11) && vis(12)) { const [a, b] = [P(11), P(12)]; scale = Math.hypot(a[0] - b[0], a[1] - b[1]); }
    else if (vis(23) && vis(24)) { const [a, b] = [P(23), P(24)]; scale = Math.hypot(a[0] - b[0], a[1] - b[1]) * 1.4; }
    if (scale < 4) continue; // too small or sideways: rely on the mask
    for (const [a, b, kind] of BONES) {
      if (!vis(a) || !vis(b)) continue;
      const r = Math.max(1.5, scale * BONE_RADIUS[kind] * S.limbs);
      const [ax, ay] = P(a), [bx, by] = P(b);

// Remove specks: keep big pieces, pieces touching a tracked person, and small

// ---------------- Per-frame GPU pipeline ----------------
function buildField(now) {

    a.f("u_hi", 0.5); a.f("u_lo", Math.max(0.02, 0.5 - S.sticky));

  const scale = Math.max(maskW, maskH) / 320;

    run("blur", blurTmp, (a) => { a.tex("u_src", src.tex); a.f("u_dir", r / maskW, 0); });

  // Whole frame: the entire camera image fits inside the screen.
  const sw = stage.width, sh = stage.height;
  const s = (S.fill ? Math.max(sw / maskW, sh / maskH) : Math.min(sw / maskW, sh / maskH)) * S.size;
  const w = (maskW * s) / sw, h = (maskH * s) / sh;

// Levels (bass / mid / high) adjust themselves to the room's volume. Beats are

const M = {

  bass: 0, mid: 0, high: 0, energy: 0, beat: 0, beatCount: 0, lastStrength: 0, lastBeat: 0,

// The listener that runs on the audio thread: splits the sound into bass / mid /
// high with simple filters, measures each every ~6 ms, and reports beats the
// moment they happen, however busy the page is.
const WORKLET_SRC = `
class Listen extends AudioWorkletProcessor {
  constructor() {
    super();
    this.lpB = 0; this.lpM = 0; this.acc = [0, 0, 0]; this.n = 0;
    this.hop = Math.round(sampleRate * 0.006);
    this.ref = [-6, -6, -6]; this.hist = []; this.t = 0; this.lastBeat = -1; this.prev = 0; this.prevThr = 0;
    this.sendAcc = [0, 0, 0]; this.sendN = 0; this.es = [0, 0, 0];
    this.L = new Float32Array(500); this.Li = 0; this.Ln = 0; this.floor = 0; this.sinceFloor = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    const aB = 1 - Math.exp(-2 * Math.PI * 150 / sampleRate), aM = 1 - Math.exp(-2 * Math.PI * 2000 / sampleRate);
    for (let i = 0; i < ch.length; i++) {
      const x = ch[i];
      this.lpB += aB * (x - this.lpB); this.lpM += aM * (x - this.lpM);
      const b = this.lpB, m = this.lpM - this.lpB, h = x - this.lpM;
      this.acc[0] += b * b; this.acc[1] += m * m; this.acc[2] += h * h;
      if (++this.n >= this.hop) this.frame();
    }
    return true;
  }
  frame() {
    const e = this.acc.map((v) => v / this.n);
    this.acc = [0, 0, 0]; this.n = 0; this.t += this.hop / sampleRate;
    // light smoothing (~15 ms) so plain noise doesn't flicker like a drum hit
    for (let k = 0; k < 3; k++) this.es[k] += (e[k] - this.es[k]) * 0.4;
    const lg = this.es.map((v) => Math.log10(v + 1e-10));
    // onset: how far each band jumped above its recent level (bass counts most)
    const w = [2.0, 1.0, 0.4];
    let on = 0;
    for (let k = 0; k < 3; k++) { on += Math.max(0, lg[k] - this.ref[k]) * w[k]; this.ref[k] += (lg[k] - this.ref[k]) * 0.25; }

    let vr = 0; for (const v of H) vr += (v - mean) * (v - mean);
    // never below a real jump (about 5 dB in the bass), however quiet the room
    const thr = Math.max(1.0, mean + 1.6 * Math.sqrt(vr / H.length) + 0.15);

    const loud = this.es[0] + this.es[1];
    this.L[this.Li] = loud; this.Li = (this.Li + 1) % this.L.length; this.Ln = Math.min(this.Ln + 1, this.L.length);

      this.floor = a[Math.floor(a.length * 0.1)];

    if (H.length > 60 && this.prev > this.prevThr && on < this.prev && this.t - this.lastBeat > 0.28 && loud > this.floor * 6 && loud > 1e-7) {

}
registerProcessor("listen", Listen);`;

function onWorklet(msg) {
  const d = msg.data, now = performance.now(), dt = Math.min(0.1, Math.max(0.005, (now - (M.lastT || now - 24)) / 1000));
  if (d.lv) {
    M.lastT = now;
    const lv = d.lv.map((v, k) => { M.peaks[k] = Math.max(M.peaks[k] * Math.exp(-dt * 0.25), v, 4e-3); return Math.min(1, v / M.peaks[k]); });
    const ease = (x, v) => x + (v - x) * (v > x ? 0.6 : Math.min(1, dt * 6));
    M.bass = ease(M.bass, lv[0]); M.mid = ease(M.mid, lv[1]); M.high = ease(M.high, lv[2]);
    M.energy += ((lv[0] * 0.45 + lv[1] * 0.4 + lv[2] * 0.15) - M.energy) * Math.min(1, dt * 3);
    M.beat *= Math.exp(-dt * 7);

// Small meter (top-left), shown with the frame-rate readout.

// ---------------- Field: interactive worlds ----------------
// Every world reads the same body map (gridSoft = now, gridPrev = last frame) and a
// motion estimate (which way and how fast the body edge is moving at a point).
const WORLD_LIST = ["dots", "web", "sparks", "snow", "ripples", "wind", "strings", "ink"];

const POINT_VS = `
attribute vec2 a_pos; attribute float a_speed;
uniform float u_size; uniform float u_grow; varying float v_s;
void main() { v_s = a_speed; gl_PointSize = u_size * (1.0 + clamp(a_speed, 0.0, 1.5) * u_grow); gl_Position = vec4(a_pos, 0.0, 1.0); }`;
const POINT_FS = `
precision mediump float; varying float v_s; uniform float u_palette;
void main() {
  float a = smoothstep(0.5, 0.22, length(gl_PointCoord - 0.5));
  float s = v_s; vec3 c;
  if (u_palette < 0.5) {            // dots: cool at rest, hot when moving
    float k = clamp(s, 0.0, 1.0);
    vec3 rest = vec3(0.5, 0.66, 1.0) * 0.75;
    vec3 hot = mix(vec3(0.6, 0.85, 1.0), vec3(1.0, 0.55, 0.8), smoothstep(0.3, 1.0, k));
    c = mix(rest, hot, smoothstep(0.02, 0.5, k)) * (0.7 + 0.8 * k);

const LINE_FS = `
precision mediump float; varying float v_s;
void main() { gl_FragColor = vec4(vec3(0.55, 0.75, 1.0) * v_s, 1.0); }`;
const LINE_VS = `
attribute vec2 a_pos; attribute float a_speed; varying float v_s;
void main() { v_s = a_speed; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

function linkProgram(vsSrc, fsSrc) {

  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));

// ---- body map helpers ----
function bodyAt(sx, sy, fit, arr) {

  if (fu < 0 || fu > 1 || fv < 0 || fv > 1) return 0;

// =============== Dots (Scatter / Gather) ===============

// =============== Web (constellation) ===============

// =============== Sparks (thrown off by fast movement) ===============

        st.vel[2 * k] = vx * (0.5 + rand() * 0.6) + (rand() - 0.5) * W * 0.25;

// =============== Snow / petals (land on the body, fly off with movement) ===============
function initSnow() {
  const W = stage.width, H = stage.height, n = Math.round(900 * S.dots);
  const st = { n, pos: new Float32Array(n * 2), vel: new Float32Array(n * 2), rest: new Uint8Array(n), melt: new Float32Array(n), phase: new Float32Array(n), petal: new Uint8Array(n), gl: new Float32Array(n * 3) };

// =============== Ripples (water surface) ===============

// =============== Wind (streaks flowing around the body) ===============
function initWind() {
  const W = stage.width, H = stage.height, n = Math.round(2200 * S.dots);

        const tt = q / 6, x = (i + tt) * dx, y = st.y0[s] + st.d[j] * (1 - tt) + st.d[j + 1] * tt;
        st.gl[3 * k] = cx(x); st.gl[3 * k + 1] = cy(y); st.gl[3 * k + 2] = glow; k++;
      }
    }
  }
  drawPoints(null, st.gl, k, Math.max(2, 2.4 * pixelRatio), 4, 0.4);
}

// =============== Ink (a slow liquid stirred by movement) ===============
function initInk() {
  const W = stage.width, H = stage.height, L = 112;
  const w = W >= H ? L : Math.round((L * W) / H), h = W >= H ? Math.round((L * H) / W) : L, n = w * h;
  const f = () => new Float32Array(n);
  return { w, h, u: f(), v: f(), u0: f(), v0: f(), p: f(), div: f(), r: f(), g: f(), b: f(), r0: f(), g0: f(), b0: f(), bc: f(), bp: f(), bytes: new Uint8Array(n * 4), tex: makeTex(w, h) };
}
function sampleBilinear(a, w, h, x, y) {
  x = Math.max(0.5, Math.min(w - 1.5, x)); y = Math.max(0.5, Math.min(h - 1.5, y));
  const x0 = x | 0, y0 = y | 0, tx = x - x0, ty = y - y0, i = y0 * w + x0;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + w] * (1 - tx) + a[i + w + 1] * tx) * ty;
}
function stepInk(st, fit, t) {
  const W = stage.width, H = stage.height, { w, h } = st, dt = frameDt;
  // body in ink-grid cells, and its motion (cells/s)
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    st.bp[i] = st.bc[i];
    st.bc[i] = gridHasBody ? bodyAt(((x + 0.5) / w) * W, ((y + 0.5) / h) * H, fit) : 0;
  }
  const col = hueRGB(t * 0.03).map((c) => Math.max(0, (c - 0.15) * 1.15));  // saturated
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x, db = st.bc[i] - st.bp[i];
    if (Math.abs(db) < 0.03) continue;
    const gx = (st.bc[i + 1] - st.bc[i - 1] + st.bp[i + 1] - st.bp[i - 1]) / 4, gy = (st.bc[i + w] - st.bc[i - w] + st.bp[i + w] - st.bp[i - w]) / 4;
    const g2 = gx * gx + gy * gy; if (g2 < 1e-5) continue;
    let mx = (-db * gx) / g2, my = (-db * gy) / g2;
    const m = Math.hypot(mx, my); if (m < 0.3) continue;   // ignore edge jitter, react to real movement
    if (m > 3) { mx *= 3 / m; my *= 3 / m; }
    const k = Math.min(1, Math.abs(db) * 3) * 0.7 * S.push;
    st.u[i] += (mx / dt - st.u[i]) * k; st.v[i] += (my / dt - st.v[i]) * k;
    const ink = Math.min(1, Math.abs(db) * 2.5) * 0.22;
    st.r[i] = Math.min(1, st.r[i] + col[0] * ink); st.g[i] = Math.min(1, st.g[i] + col[1] * ink); st.b[i] = Math.min(1, st.b[i] + col[2] * ink);
  }
  const kick = beatEvent(st);
  if (kick) {
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x, v = st.bc[i];
      if (v < 0.25 || v > 0.7 || rand() > 0.4) continue;
      let nx = -(st.bc[i + 1] - st.bc[i - 1]), ny = -(st.bc[i + w] - st.bc[i - w]);
      const nl = Math.hypot(nx, ny) || 1;
      st.u[i] += (nx / nl) * 14 * kick; st.v[i] += (ny / nl) * 14 * kick;
      const a = 0.35 * kick;
      st.r[i] = Math.min(1, st.r[i] + col[0] * a); st.g[i] = Math.min(1, st.g[i] + col[1] * a); st.b[i] = Math.min(1, st.b[i] + col[2] * a);
    }
  }
  // advect velocity
  st.u0.set(st.u); st.v0.set(st.v);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x, px = x - dt * st.u0[i], py = y - dt * st.v0[i];
    st.u[i] = sampleBilinear(st.u0, w, h, px, py) * 0.995; st.v[i] = sampleBilinear(st.v0, w, h, px, py) * 0.995;
  }
  // keep it swirling, not spreading: remove divergence
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x; st.div[i] = -0.5 * (st.u[i + 1] - st.u[i - 1] + st.v[i + w] - st.v[i - w]); st.p[i] = 0;
  }
  for (let it = 0; it < 16; it++) for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x; st.p[i] = (st.div[i] + st.p[i - 1] + st.p[i + 1] + st.p[i - w] + st.p[i + w]) * 0.25;
  }
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x; st.u[i] -= 0.5 * (st.p[i + 1] - st.p[i - 1]); st.v[i] -= 0.5 * (st.p[i + w] - st.p[i - w]);
  }
  // advect and slowly fade the ink
  st.r0.set(st.r); st.g0.set(st.g); st.b0.set(st.b);
  const fade = Math.exp(-dt * (0.08 + 0.35 * (1 - Math.min(1, S.springBack / 2))));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, px = x - dt * st.u[i], py = y - dt * st.v[i];
    st.r[i] = sampleBilinear(st.r0, w, h, px, py) * fade; st.g[i] = sampleBilinear(st.g0, w, h, px, py) * fade; st.b[i] = sampleBilinear(st.b0, w, h, px, py) * fade;
    const o = 4 * i;
    st.bytes[o] = Math.min(255, st.r[i] * 210); st.bytes[o + 1] = Math.min(255, st.g[i] * 210); st.bytes[o + 2] = Math.min(255, st.b[i] * 210); st.bytes[o + 3] = 255;
  }
  gl.bindTexture(gl.TEXTURE_2D, st.tex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, st.bytes);
}

// ---- trail buffer helpers (sparks, wind) ----
function fadeTrail(decay) { run("fade", fbB, (a) => { a.tex("u_prev", fbA.tex); a.f("u_decay", decay); }); }
function swapTrail() { [fbA, fbB] = [fbB, fbA]; }

const WORLD_INIT = { dots: initDots, web: initWeb, sparks: initSparks, snow: initSnow, ripples: initRipples, wind: initWind, strings: initStrings, ink: initInk };
function freeWorld() { if (W_ && W_.tex) gl.deleteTexture(W_.tex); W_ = null; }

function renderField(now, fit, common, t) {
  frameDt = Math.min(0.15, Math.max(0.02, (now - (lastFrameT || now - 50)) / 1000)); lastFrameT = now;
  const name = WORLD_LIST.includes(S.world) ? S.world : "dots";
  const key = `${name}:${stage.width}x${stage.height}:${S.dots}`;
  if (key !== worldKey) { freeWorld(); W_ = WORLD_INIT[name](); worldKey = key; if (name === "sparks" || name === "wind") clearFeedback(); }
  const compose = (tex, mode, flip, texel) => run("compose", null, (a) => {
    common(a); a.tex("u_bg", tex); a.f("u_bgMode", mode); a.f("u_flipY", flip); a.f("u_texel", ...(texel || [0, 0]));
  });
  switch (name) {
    case "dots": run("shadow", null, common); stepDots(W_, fit); break;
    case "web": run("shadow", null, common); stepWeb(W_, fit); break;
    case "snow": run("shadow", null, common); stepSnow(W_, fit, t); break;
    case "strings": run("shadow", null, common); stepStrings(W_, fit); break;
    case "sparks": stepSparks(W_, fit); compose(fbA.tex, 0, 0); break;
    case "wind": stepWind(W_, fit, t); compose(fbA.tex, 0, 0); break;
    case "ripples": stepRipples(W_, fit); compose(W_.tex, 1, 1, [1 / W_.rw, 1 / W_.rh]); break;
    case "ink": stepInk(W_, fit, t); compose(W_.tex, 0, 1); break;
  }
}

let startTime = performance.now();
let paintFrame = 0;
function render(now) {
  const fit = fitRect();
  const common = (a) => {
    a.f("u_fit", ...fit); a.f("u_mirror", S.mirror ? 1 : 0);
    a.f("u_cut", S.cutoff); a.f("u_soft", S.soft); a.f("u_glow", Math.min(1.5, S.glow + musicGlow()));
    a.f("u_style", { solid: 0, outline: 1, neon: 2 }[S.style] ?? 2);
    a.f("u_line", S.line * pixelRatio); a.f("u_invert", S.invert ? 1 : 0);
    a.tex("u_field", field.tex);
  };
  const t = (now - startTime) / 1000;

  if (S.mode === "shadow") {
    run("shadow", null, common);
  } else if (S.mode === "field") {
    renderField(now, fit, common, t);
  } else if (S.mode === "trails" || S.mode === "paint") {
    const trails = S.mode === "trails";
    // decay per frame: trails fade within ~0.2–4 s; paint lingers or stays forever
    const decay = trails ? 0.80 + 0.19 * Math.pow(S.trailLength, 0.6) : 1;
    // 8-bit buffers can only fade one step at a time, so paint fades by skipping frames:
    // Fade 0 = never, low = minutes, 1 = about 8 seconds.
    paintFrame++;
    const every = Math.round(1 + (1 - S.paintFade) * 30);
    const sub = trails ? 1.2 / 255 : (S.paintFade > 0 && paintFrame % every === 0 ? 1 / 255 : 0);
    const color = trails ? [0.85, 0.92, 1.0] : hueRGB(t * (0.01 + S.hueSpeed * 0.12) + musicEnergy() * 0.15);
    run("feedback", fbB, (a) => {
      common(a); a.tex("u_prev", fbA.tex);
      a.f("u_decay", decay); a.f("u_sub", sub); a.f("u_ink", trails ? 1.0 : Math.min(1, 0.3 * (1 + (M.on ? M.beat * S.musicAmt : 0)))); a.f("u_color", ...color);
    });
    [fbA, fbB] = [fbB, fbA];
    run(trails ? "trailsShow" : "paintShow", null, (a) => { common(a); a.tex("u_buf", fbA.tex); });
  } else if (S.mode === "partner") {
    run("partner", null, (a) => {
      common(a);
      a.tex("u_past", pastField(now, partnerDelay()));
      a.f("u_facing", S.facing ? 1 : 0); a.f("u_shift", S.shift);

}

function hueRGB(h) {
  h = h - Math.floor(h);
  const k = [0, 4, 2].map((o) => Math.min(Math.max(Math.abs(((h * 6 + o) % 6) - 3) - 1, 0), 1));
  return k.map((v) => 0.15 + 0.85 * v);
}

// ---------------- Model ----------------
let vision = null, fileset = null, segmenter = null, segKind = "seg", switching = false;

async function loadModel(key) {
  if (!vision) vision = await import(TASKS_URL);
  if (!fileset) fileset = await vision.FilesetResolver.forVisionTasks(WASM_URL);
  const M = MODELS[key];
  const make = (delegate) => M.kind === "pose"
    ? vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: M.url, delegate },
        runningMode: "VIDEO", numPoses: 2, outputSegmentationMasks: true,
        minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5
      })
    : vision.ImageSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: M.url, delegate },
        runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false
      });
  let seg;
  if (S.engine === "cpu") seg = await make("CPU");
  else {
    try { seg = await make("GPU"); }
    catch (e) { console.warn("GPU delegate failed, using CPU", e); seg = await make("CPU"); }
  }
  if (segmenter) segmenter.close();
  segmenter = seg; segKind = M.kind;
}

// Small frame for the model. The model works at 256 px internally anyway, and its
// mask comes back at the size of whatever we feed it, so a small input keeps the
// whole chain cheap. The big, crisp edge is made later on the GPU.
const proc = document.createElement("canvas");
const procCtx = proc.getContext("2d", { alpha: false, desynchronized: true });
const PROC_LONG = 320;

// ---------------- Camera ----------------
let stream = null, camPortrait = null, camFps = 0;
const isPortrait = () => window.innerHeight > window.innerWidth;
async function startCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  // Ask for a camera picture shaped like the screen, so it fills it.
  camPortrait = isPortrait();
  const size = camPortrait ? { width: { ideal: 480 }, height: { ideal: 640 } } : { width: { ideal: 640 }, height: { ideal: 480 } };
  const base = { facingMode: S.facingMode, ...size };
  try {
    // Prefer a steady 24–30 fps; phones drop to 15 in dim light otherwise.
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, frameRate: { min: 24, ideal: 30 } } });
  } catch (e) {
    if (e && e.name === "NotAllowedError") throw e;
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, frameRate: { ideal: 30 } } });
  }
  video.srcObject = stream;
  await video.play();
  try { camFps = Math.round(stream.getVideoTracks()[0].getSettings().frameRate || 0); } catch (e) { camFps = 0; }
}
// Turning the phone: restart the camera so its picture matches again.
window.addEventListener("resize", () => {
  if (!running || DEMO || camPortrait === null || isPortrait() === camPortrait) return;
  clearTimeout(startCamera._t);
  startCamera._t = setTimeout(() => startCamera().catch(console.error), 300);
});

// ---------------- Main loop ----------------
let running = false, lastTs = 0;
let frames = 0, fpsStart = performance.now(), segTotal = 0, workTotal = 0, camDelivered = 0;

function processFrame() {
  const now = performance.now();
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || !segmenter || switching) return;
  const k = PROC_LONG / Math.max(vw, vh);
  const pw = Math.round(vw * k), ph = Math.round(vh * k);
  if (proc.width !== pw || proc.height !== ph) { proc.width = pw; proc.height = ph; }
  const kf = FULL_LONG / Math.max(vw, vh);
  fullW = Math.round(vw * kf); fullH = Math.round(vh * kf);
  const r = { ...roi };
  procCtx.drawImage(video, r.x * vw, r.y * vh, r.w * vw, r.h * vh, 0, 0, pw, ph);

  const ts = Math.max(now, lastTs + 1); lastTs = ts;
  const t0 = performance.now();
  let got = false;
  if (segKind === "pose") {
    segmenter.detectForVideo(proc, ts, (result) => {
      const masks = result.segmentationMasks;
      if (masks && masks.length) { const [p, w, h] = readMasks(masks, false); processMask(p, w, h, result.landmarks, r); got = true; }
    });
  } else {
    segmenter.segmentForVideo(proc, ts, (result) => {
      const masks = result.confidenceMasks;
      if (masks && masks.length) { const [p, w, h] = readMasks([masks[0]], MODELS[S.model].invert); processMask(p, w, h, null, r); got = true; }
    });
  }
  // No person found: show an empty wall (fade out through steadiness).
  if (!got) { if (!prob || prob.length !== pw * ph) prob = new Float32Array(pw * ph); prob.fill(0); processMask(prob, pw, ph, null, r); }
  segTotal += performance.now() - t0;
  if (!maskW) return;
  buildField(now);
  render(now);
  workTotal += performance.now() - now;
  countFrame(now);
}

function countFrame(now) {
  frames++;
  if (now - fpsStart >= 1000) {
    const fps = Math.round(frames * 1000 / (now - fpsStart));
    const secs = (now - fpsStart) / 1000;
    const cam = camDelivered ? ` · camera sending ${Math.round(camDelivered / secs)}` : (camFps ? ` · camera set to ${camFps}` : "");
    const zoom = S.follow ? ` · zoom ${(1 / roi.w).toFixed(1)}x` : "";
    fpsEl.textContent = `${APP_VERSION} · ${fps} fps · model ${(segTotal / frames).toFixed(0)} ms · total ${(workTotal / frames).toFixed(0)} ms${cam}${zoom}`;
    frames = 0; segTotal = 0; workTotal = 0; camDelivered = 0; fpsStart = now;
  }
}

// Run once per new camera frame when the browser supports it (lowest lag);
// otherwise poll on each display refresh.
function loop() {
  if (!running) return;
  if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
    // The camera callback only notes a new frame; the heavy work runs right after
    // as its own task, so it never holds up the screen's drawing step.
    const mc = new MessageChannel();
    let pending = false, lastPresented = -1;
    mc.port1.onmessage = () => { pending = false; if (running) processFrame(); };
    const onFrame = (_now, meta) => {
      if (!running) return;
      if (meta && meta.presentedFrames != null) {
        if (lastPresented >= 0) camDelivered += Math.max(1, meta.presentedFrames - lastPresented);
        lastPresented = meta.presentedFrames;
      }
      if (!pending) { pending = true; mc.port2.postMessage(0); }
      video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
  } else {
    let lastTime = -1;
    const onRaf = () => {
      if (!running) return;
      if (video.currentTime !== lastTime) { lastTime = video.currentTime; processFrame(); }
      requestAnimationFrame(onRaf);
    };
    requestAnimationFrame(onRaf);
  }
}

// ---------------- Demo source (for testing without a camera or model) ----------------
// A simple figure that dances, rendered into a mask. Open the page with ?demo.
function demoMask(t, w, h) {
  procCtx.fillStyle = "#000"; procCtx.fillRect(0, 0, w, h);
  procCtx.fillStyle = "#fff"; procCtx.strokeStyle = "#fff"; procCtx.lineCap = "round";
  const cx = w * (0.5 + 0.18 * Math.sin(t * 0.7)), cy = h * 0.5;
  const u = h / 10;
  procCtx.beginPath(); procCtx.arc(cx, cy - 3.2 * u, 0.7 * u, 0, Math.PI * 2); procCtx.fill();
  procCtx.lineWidth = 1.3 * u;
  const limb = (x0, y0, a1, l1, a2, l2) => {
    const x1 = x0 + Math.sin(a1) * l1, y1 = y0 + Math.cos(a1) * l1;
    const x2 = x1 + Math.sin(a2) * l2, y2 = y1 + Math.cos(a2) * l2;
    procCtx.beginPath(); procCtx.moveTo(x0, y0); procCtx.lineTo(x1, y1); procCtx.lineTo(x2, y2); procCtx.stroke();
  };
  procCtx.beginPath(); procCtx.moveTo(cx, cy - 2.2 * u); procCtx.lineTo(cx, cy + 0.6 * u); procCtx.lineWidth = 1.7 * u; procCtx.stroke();
  procCtx.lineWidth = 0.75 * u;
  const s = Math.sin(t * 2.2), c = Math.cos(t * 1.6);
  limb(cx, cy - 2.0 * u, Math.PI * (0.55 + 0.35 * s), 1.4 * u, Math.PI * (0.75 + 0.4 * c), 1.3 * u);
  limb(cx, cy - 2.0 * u, -Math.PI * (0.55 - 0.35 * c), 1.4 * u, -Math.PI * (0.8 + 0.3 * s), 1.3 * u);
  procCtx.lineWidth = 0.95 * u;
  limb(cx, cy + 0.6 * u, 0.25 + 0.3 * s, 1.8 * u, 0.1 + 0.2 * s, 1.8 * u);
  limb(cx, cy + 0.6 * u, -0.25 + 0.3 * c, 1.8 * u, -0.1 - 0.2 * c, 1.8 * u);
  const img = procCtx.getImageData(0, 0, w, h).data;
  const out = new Float32Array(w * h);
  for (let i = 0; i < out.length; i++) out[i] = img[i * 4] / 255;
  // add a little edge noise, like a real model
  for (let i = 0; i < out.length; i++) if (out[i] > 0 && out[i] < 1) out[i] = Math.min(1, Math.max(0, out[i] + (Math.random() - 0.5) * 0.6));
  return out;
}
function demoLoop() {
  const w = 320, h = 240;
  proc.width = w; proc.height = h;
  S.follow = false;
  const tick = () => {
    if (!running) return;
    const now = performance.now();
    const t0 = performance.now();
    const dm = demoMask(now / 1000, w, h);
    for (let b = 0; b < 6; b++) { // fake background specks
      const bx = (Math.random() * w) | 0, by = (Math.random() * h) | 0;
      for (let y = by; y < Math.min(h, by + 4); y++) for (let x = bx; x < Math.min(w, bx + 4); x++) dm[y * w + x] = 0.9;
    }
    fullW = 480; fullH = 360;
    processMask(dm, w, h, null, { x: 0, y: 0, w: 1, h: 1 });
    segTotal += performance.now() - t0;

  $("lookNote").textContent = S.look === "custom" ? "· custom (fine-tuned)" : "";
  document.querySelectorAll("[data-field]").forEach((b) => b.classList.toggle("on", b.dataset.field === S.fieldMode));
  document.querySelectorAll("[data-world]").forEach((b) => b.classList.toggle("on", b.dataset.world === S.world));
  $("scatterRow").style.display = S.world === "dots" ? "" : "none";
  $("returnRow").style.display = ["dots", "ripples", "strings", "ink"].includes(S.world) ? "" : "none";
  $("returnLabel").textContent = { dots: "Return", ripples: "Linger", strings: "Ring", ink: "Linger" }[S.world] || "Return";
  $("limbsRow").style.display = S.model === "body" ? "" : "none";
  document.querySelectorAll("#styles button[data-style]").forEach((b) => b.classList.toggle("on", b.dataset.style === S.style));
  $("invertBtn").classList.toggle("on", S.invert);
  $("fillBtn").classList.toggle("on", S.fill);
  $("followBtn").classList.toggle("on", S.follow);
  $("followBtn").textContent = S.follow ? "Follow me: on" : "Follow me: off";
  $("fillBtn").textContent = S.fill ? "Fill screen" : "Whole frame";
  $("facingBtn").classList.toggle("on", S.facing);
  $("facingBtn").textContent = S.facing ? "Facing me" : "Same direction";
  $("modelBtn").textContent = "Model: " + MODELS[S.model].label;
  $("engineBtn").textContent = "Engine: " + S.engine.toUpperCase();
}

document.querySelectorAll("#modes button").forEach((b) => b.addEventListener("click", () => {
  S.mode = b.dataset.mode; save(); syncUI();
  if (S.mode === "trails" || S.mode === "paint") clearFeedback();
}));
document.querySelectorAll("#looks button").forEach((b) => b.addEventListener("click", () => {
  Object.assign(S, LOOKS[b.dataset.look]); S.look = b.dataset.look; save(); syncUI();
}));
document.querySelectorAll("[data-field]").forEach((b) => b.addEventListener("click", () => { S.fieldMode = b.dataset.field; save(); syncUI(); }));
document.querySelectorAll("[data-world]").forEach((b) => b.addEventListener("click", () => { S.world = b.dataset.world; worldKey = ""; save(); syncUI(); }));
$("clearWorldBtn").addEventListener("click", () => { worldKey = ""; clearFeedback(); });
document.querySelectorAll("input[data-key]").forEach((inp) => inp.addEventListener("input", () => {
  S[inp.dataset.key] = parseFloat(inp.value);
  if (LOOK_KEYS.includes(inp.dataset.key) && S.look !== "custom") { S.look = "custom"; syncUI(); }
  inp.nextElementSibling.textContent = fmt(inp.dataset.key, S[inp.dataset.key]);
  save();
}));
$("clearBtn").addEventListener("click", clearFeedback);
$("musicBtn").addEventListener("click", async () => {
  const note = $("musicNote");
  if (M.on) { stopMusic(); note.textContent = ""; syncUI(); return; }
  note.textContent = "Starting the microphone…";
  try { await startMusic(); note.textContent = "Play music from a speaker nearby. The meter at the top left shows what it hears."; }
  catch (e) { console.error(e); note.textContent = (e && e.name === "NotAllowedError") ? "Microphone permission was blocked. Allow it in the browser settings and try again." : "Couldn't start the microphone on this device."; }
  syncUI();
});
$("beatDelayBtn").addEventListener("click", () => {
  const order = [0, 1, 2, 4]; S.partnerBeats = order[(order.indexOf(S.partnerBeats) + 1) % order.length]; save(); syncUI();
});
document.querySelectorAll("#styles button[data-style]").forEach((b) => b.addEventListener("click", () => { S.style = b.dataset.style; save(); syncUI(); }));
$("invertBtn").addEventListener("click", () => { S.invert = !S.invert; save(); syncUI(); });
$("followBtn").addEventListener("click", () => { S.follow = !S.follow; save(); syncUI(); });
$("fillBtn").addEventListener("click", () => { S.fill = !S.fill; save(); syncUI(); });
$("facingBtn").addEventListener("click", () => { S.facing = !S.facing; save(); syncUI(); });
$("mirrorBtn").addEventListener("click", () => { S.mirror = !S.mirror; save(); syncUI(); });
$("flipBtn").addEventListener("click", async () => {
  S.facingMode = S.facingMode === "user" ? "environment" : "user";
  S.mirror = S.facingMode === "user";
  save(); syncUI();
  if (!DEMO) { try { await startCamera(); } catch (e) { console.error(e); } }
});
$("modelBtn").addEventListener("click", async () => {
  if (DEMO) return;
  const next = MODEL_ORDER[(MODEL_ORDER.indexOf(S.model) + 1) % MODEL_ORDER.length];
  const btn = $("modelBtn"); btn.disabled = true; btn.textContent = "Loading…";
  switching = true;
  try { await loadModel(next); S.model = next; save(); } catch (e) { console.error(e); }
  switching = false; btn.disabled = false; syncUI();
});
$("engineBtn").addEventListener("click", async () => {
  if (DEMO) return;
  const btn = $("engineBtn"); btn.disabled = true; btn.textContent = "Loading…";
  const prev = S.engine;
  S.engine = S.engine === "gpu" ? "cpu" : "gpu";
  switching = true;
  try { await loadModel(S.model); save(); } catch (e) { console.error(e); S.engine = prev; }
  switching = false; btn.disabled = false; syncUI();
});
$("fullBtn").addEventListener("click", () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
});
$("resetBtn").addEventListener("click", () => {
  const keep = { facingMode: S.facingMode, model: S.model, mode: S.mode, style: S.style };
  S = { ...DEFAULTS, ...keep, mirror: keep.facingMode === "user" }; save(); syncUI();
});
stage.addEventListener("click", () => {
  if (!running) return;
  controls.classList.toggle("show"); fpsEl.classList.toggle("show");
});
syncUI();
$("version").textContent = APP_VERSION;
fpsEl.textContent = APP_VERSION;

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  if (DEMO) {
    intro.style.display = "none"; controls.classList.add("show"); fpsEl.classList.add("show");
    running = true; demoLoop(); return;
  }
  statusEl.textContent = "Starting camera…";
  try {
    await startCamera();
    intro.style.display = "none"; controls.classList.add("show"); fpsEl.classList.add("show");
    running = true; keepAwake(); loop();
  } catch (e) {
    console.error(e);
    startBtn.disabled = false;
    statusEl.textContent = (e && e.name === "NotAllowedError")
      ? "Camera permission was blocked. Allow it in the browser settings and try again."
      : "Could not open the camera. This page has to be opened from an https link.";
  }
});

if (DEMO) { statusEl.textContent = "Demo mode (no camera)"; startBtn.disabled = false; }
else {
  loadModel(S.model)
    .catch((e) => { console.error(e); if (S.model === "fast") throw e; S.model = "fast"; syncUI(); return loadModel("fast"); })
    .then(() => { statusEl.textContent = "Ready"; startBtn.disabled = false; })
    .catch((e) => { console.error(e); statusEl.textContent = "Could not load the body-tracking model. Check the connection and reload."; });
}

// Expose a tiny hook for automated testing.
window.__shadowPartner = { settings: () => S, set: (k, v) => { S[k] = v; syncUI(); }, processMask, roi: () => roi, music: () => ({ on: M.on, worklet: M.worklet, bpm: M.bpm, beats: M.beatCount, energy: +M.energy.toFixed(2), bass: +M.bass.toFixed(2) }), setFull: (w, h) => { fullW = w; fullH = h; }, draw: (t) => { buildField(t); render(t); } };
</script>
</body>
</html>
